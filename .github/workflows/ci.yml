# NOTE: CI runs only on PR + push to main to avoid noisy runs.
# Email-on-failure: GitHub notifies watchers by default; disable in GitHub Settings -> Notifications -> Actions,
# or repo Settings -> Notifications. Non-blocking steps use continue-on-error.
name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with: { go-version: '1.26' }
      - name: gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "gofmt issues:"
            gofmt -l .
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
