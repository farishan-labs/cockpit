<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cockpit</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='white'/></svg>">
<!-- htmx removed to avoid polling conflicts -->
<link rel="stylesheet" href="/tokens.css">
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #0b0d10; color: #e6e6e6; }
  header { padding: 1rem 1.5rem; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
  main { padding: 1.5rem; max-width: 1100px; margin: 0 auto; }
  .card { background: #14181d; border: 1px solid #222; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  td, th { overflow-wrap: anywhere; word-break: break-word; }
  pre { white-space: pre-wrap; word-break: break-all; max-width: 100%; margin: 0; }
  .card { overflow-x: auto; }
  th, td { text-align: left; padding: .5rem; border-bottom: 1px solid #222; }
  .live { color: #4ade80; }
  .dead { color: #f87171; }
  button { background: #2563eb; color: #fff; border: 0; padding: .4rem .8rem; border-radius: 6px; cursor: pointer; }
  button.danger { background: #dc2626; }
  select, input { background: #0b0d10; color: #e6e6e6; border: 1px solid #333; padding: .4rem; border-radius: 6px; }
  .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  h2 { margin-top: 0; }
</style>
</head>
<body>
<header>
  <div><strong>Cockpit</strong> — Faris Han Labs control plane</div>
  <div id="status">connecting…</div>
</header>
<main>
  <div class="card">
    <h2>Launch agent</h2>
    <div class="row">
      <select id="agentSelect" name="agent">
        <!-- filled by htmx? we'll load via JS -->
      </select>
      <input id="sessionName" placeholder="session name (optional)" />
      <button onclick="launch()">Launch</button>
    </div>
  </div>

  <div class="card">
    <h2>Sessions</h2>
    <div id="sessions">loading…</div>
  </div>

  <div class="card">
    <h2>Agents on PATH</h2>
    <div id="agents">loading…</div>
  </div>

  <div class="card">
    <h2>Adapters (M3)</h2>
    <div id="adapters">loading…</div>
  </div>


  <div class="card">
    <h2>Machines</h2>
    <div id="machines">loading…</div>
  </div>

  <div class="card">
    <h2>Extensions</h2>
    <div id="extensions">loading…</div>
    <div id="extTabs" style="margin-top:1rem"></div>
    <div id="extFrameWrap" style="margin-top:1rem"></div>
  </div>

  <div class="card">
    <h2>Doctor</h2>
    <div id="doctor">loading…</div>
  </div>

  <div class="card">
    <h2>Operator</h2>
    <div id="operator">loading…</div>
  </div>
</main>

<script>
async function loadAgents() {
  const r = await fetch('/api/agents');
  const data = await r.json();
  const sel = document.getElementById('agentSelect');
  sel.innerHTML = '';
  for (const a of data) {
    const opt = document.createElement('option');
    opt.value = a.name; opt.textContent = a.name;
    sel.appendChild(opt);
  }
}
loadAgents();

function renderSessions(data) {
  let html = '<table><thead><tr><th>Name</th><th>Agent</th><th>Status</th><th>Live</th><th></th></tr></thead><tbody>';
  for (const s of data) {
    html += `<tr>
      <td>${s.name}</td>
      <td>${s.agent||'-'}</td>
      <td class="${s.live?'live':'dead'}">${s.status}</td>
      <td>${s.live?'yes':'no'}</td>
      <td>${s.live?`<button class="danger" onclick="kill('${s.name}')">Kill</button>`:''}</td>
    </tr>`;
  }
  html += '</tbody></table>';
  return html;
}

// override htmx? We'll just poll manually for sessions to render nicely
async function refreshSessions() {
  const r = await fetch('/api/sessions');
  const data = await r.json();
  document.getElementById('sessions').innerHTML = renderSessions(data);
}
refreshSessions();
// refresh on websocket updates (server pushes on change)

async function refreshAgents() {
  const r = await fetch('/api/agents');
  const data = await r.json();
  let html = '<ul>';
  for (const a of data) html += `<li>${a.name} — ${a.path}</li>`;
  html += '</ul>';
  document.getElementById('agents').innerHTML = html;
}
refreshAgents();

async function refreshAdapters() {
  const r = await fetch('/api/adapters');
  const data = await r.json();
  let html = '<table><thead><tr><th>Name</th><th>Available</th><th>Status</th></tr></thead><tbody>';
  for (const a of data) {
    html += `<tr><td>${a.name}</td><td>${a.available?'yes':'no'}</td><td><pre>${JSON.stringify(a.status||{})}</pre></td></tr>`;
    if (a.error) html += `<tr><td colspan="3" class="dead">${a.error}</td></tr>`;
  }
  html += '</tbody></table>';
  document.getElementById('adapters').innerHTML = html;
}
refreshAdapters();


async function refreshMachines() {
  const r = await fetch('/api/machines');
  const data = await r.json();
  const ms = data.machines || [];
  let html = '<table><thead><tr><th>Name</th><th>Host</th><th>T3</th><th></th></tr></thead><tbody>';
  for (const m of ms) {
    const t3 = (m.t3_state && m.t3_state.service_status) || 'unknown';
    html += `<tr><td>${m.name||m.id}</td><td>${m.host}</td><td>${t3}</td><td>
      <button onclick="checkMachine('${m.id}')">Re-check</button>
      <button onclick="pairMachine('${m.id}')">Pair</button>
    </td></tr>`;
  }
  html += '</tbody></table>';
  document.getElementById('machines').innerHTML = html || 'none';
}
refreshMachines();

async function checkMachine(id) {
  await fetch('/api/machines/check?name='+encodeURIComponent(id), {method:'POST'});
  refreshMachines();
}
async function pairMachine(id) {
  const r = await fetch('/api/machines/pair', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({machine:id})});
  const data = await r.json();
  alert(data.result || 'paired');
  refreshMachines();
}

async function refreshExtensions() {
  const r = await fetch('/api/extensions');
  const data = await r.json();
  let html = '<table><thead><tr><th>Name</th><th>Kind</th><th>Available</th><th>Tabs</th></tr></thead><tbody>';
  for (const e of data) {
    html += `<tr><td>${e.name}</td><td>${e.kind}</td><td>${e.available?'yes':'no'}</td><td>${(e.tabs||[]).map(t=>t.title).join(', ')}</td></tr>`;
  }
  html += '</tbody></table>';
  document.getElementById('extensions').innerHTML = html || 'none';
  // render tab buttons + iframe
  const tabsDiv = document.getElementById('extTabs');
  const wrap = document.getElementById('extFrameWrap');
  tabsDiv.innerHTML = '';
  wrap.innerHTML = '';
  for (const e of data) {
    if (!e.enabled || !e.available) continue;
    for (const t of (e.tabs||[])) {
      const btn = document.createElement('button');
      btn.textContent = t.title;
      btn.style.marginRight = '0.5rem';
      btn.onclick = () => { wrap.innerHTML = `<iframe src="${t.url}" style="width:100%;height:60vh;border:1px solid #333;border-radius:8px"></iframe>`; };
      tabsDiv.appendChild(btn);
    }
  }
}
refreshExtensions();

async function refreshDoctor() {
  const r = await fetch('/api/doctor');
  const data = await r.json();
  document.getElementById('doctor').innerHTML = `<p>tmux: ${data.tmux?'OK':'MISSING'}</p><p>port: ${data.port}</p>`;
  refreshOperator();
}
refreshDoctor();

async function refreshOperator() {
  const r = await fetch('/operator');
  const data = await r.json();
  const v = data.validation;
  let status = 'n/a';
  let cap = '';
  if (data.validation_skipped) status = 'skipped (usermd-check missing)';
  else if (v) {
    const s = v.summary || {};
    status = (s.errors > 0) ? 'FAIL' : 'OK';
    cap = v.char_count + ' / ' + v.budget + ' chars';
  }
  const esc = (str) => (str||'').replace(/</g,'&lt;');
  document.getElementById('operator').innerHTML =
    `<p>path: ${esc(data.path)}</p>` +
    `<p>status: ${status} ${cap}</p>` +
    `<p>last audit: ${data.last_audit||'unknown'}</p>` +
    `<pre>${esc(data.profile)}</pre>`;
}
refreshOperator();

async function launch() {
  const agent = document.getElementById('agentSelect').value;
  const name = document.getElementById('sessionName').value;
  const r = await fetch('/api/launch', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({agent, name})});
  if (!r.ok) { alert(await r.text()); return; }
  refreshSessions();
}

async function kill(name) {
  await fetch('/api/kill', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name})});
  refreshSessions();
}

// websocket for live updates
const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
const ws = new WebSocket(wsProto + '//' + location.host + '/ws');
ws.onopen = () => document.getElementById('status').textContent = 'connected';
ws.onmessage = () => { refreshSessions(); };
ws.onclose = () => document.getElementById('status').textContent = 'disconnected';
</script>
</body>
</html>
